name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      GTM_DATABASE: ${{ secrets.GTM_DATABASE }}
      MULTICA_DATABASE_URL: ${{ secrets.MULTICA_DATABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      CIA_HUB_TOKEN: ${{ secrets.CIA_HUB_TOKEN }}
      CIA_HUB_URL: ${{ secrets.CIA_HUB_URL }}
      GTM_SERVER_URL: ${{ secrets.GTM_SERVER_URL }}
      GTM_PUBLIC_URL: ${{ secrets.GTM_PUBLIC_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
      FLATKEY_API_KEY: ${{ secrets.FLATKEY_API_KEY }}
      PROJECT_DIR: ${{ secrets.PROJECT_DIR }}
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DB_PASSWORD,GTM_DATABASE,MULTICA_DATABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,NEXT_PUBLIC_SUPABASE_URL,CIA_HUB_TOKEN,CIA_HUB_URL,GTM_SERVER_URL,GTM_PUBLIC_URL,ANTHROPIC_API_KEY,ANTHROPIC_AUTH_TOKEN,ANTHROPIC_BASE_URL,ANTHROPIC_MODEL,FLATKEY_API_KEY,PROJECT_DIR
          script: |
            set -e
            DEPLOY_DIR="${PROJECT_DIR}/dashboard"

            # Clone repo if first deploy. Existing deploy clones are reset below.
            if [ ! -d "${DEPLOY_DIR}/.git" ]; then
              ssh-keyscan github.com >> ~/.ssh/known_hosts
              git clone git@github.com:SolveaCX/gtm-swarm.git "${DEPLOY_DIR}"
            fi

            cd "${DEPLOY_DIR}"
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            mkdir -p "${PROJECT_DIR}/data"

            # Write secrets to .env
            {
              echo "NODE_ENV=production"
              echo "GTM_DATA_DIR=${PROJECT_DIR}/data"
              echo "DB_PASSWORD=${DB_PASSWORD}"
              echo "GTM_DATABASE=${GTM_DATABASE}"
              echo "MULTICA_DATABASE_URL=${MULTICA_DATABASE_URL}"
              echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}"
              echo "NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}"
              echo "CIA_HUB_TOKEN=${CIA_HUB_TOKEN}"
              echo "CIA_HUB_URL=${CIA_HUB_URL}"
              echo "GTM_SERVER_URL=${GTM_SERVER_URL}"
              echo "GTM_PUBLIC_URL=${GTM_PUBLIC_URL}"
              echo "ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}"
              echo "ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN}"
              echo "ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL}"
              echo "ANTHROPIC_MODEL=${ANTHROPIC_MODEL}"
              echo "FLATKEY_API_KEY=${FLATKEY_API_KEY}"
            } > "${DEPLOY_DIR}/.env"

            npm ci
            npm run build
            pm2 delete gtm-swarm 2>/dev/null || true
            pm2 start ecosystem.config.js
